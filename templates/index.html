<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TelAI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            TelAI
        </div>

        <button
            id="clearButton"
            class="clear-button"
        >
            New Chat
        </button>

    </header>


    <main
        id="chatContainer"
        class="chat-container"
    >

        <div class="welcome">

            <h1>How can I help you?</h1>

            <p>
                Ask me anything.
            </p>

        </div>

    </main>


    <div class="composer-wrapper">

        <form
            id="chatForm"
            class="composer"
        >

            <textarea
                id="messageInput"
                placeholder="Message TelAI..."
                rows="1"
            ></textarea>

            <button
                type="submit"
                id="sendButton"
            >
                ↑
            </button>

        </form>

        <div class="footer-text">
            TelAI can make mistakes. Check important information.
        </div>

    </div>

</div>


<script src="/static/js/chatbot.js"></script>

</body>

</html>
