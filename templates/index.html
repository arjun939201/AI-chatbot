<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Chatbot</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                AI
            </div>

            <div>
                <div class="brand-name">
                    AI Chatbot
                </div>

                <div class="brand-subtitle">
                    AI Assistant
                </div>
            </div>

        </div>


        <button
            id="clearButton"
            class="new-chat-button"
        >
            <span>＋</span>
            New chat
        </button>


        <div class="sidebar-section">

            <div class="section-title">
                TODAY
            </div>

            <div class="chat-item active">

                <span class="chat-icon">
                    ◌
                </span>

                <span>
                    New conversation
                </span>

            </div>

        </div>


        <div class="sidebar-bottom">

            <div class="status">

                <span class="status-dot"></span>

                <span>
                    AI Online
                </span>

            </div>

            <div class="powered">
                Powered by Groq
            </div>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="mobile-brand">

                <div class="brand-icon small">
                    AI
                </div>

                <span>
                    AI Chatbot
                </span>

            </div>


            <div class="model-info">

                <span class="model-name">
                    AI Chatbot
                </span>

                <span class="model-badge">
                    AI
                </span>

            </div>


            <button
                id="mobileNewChat"
                class="mobile-new-chat"
            >
                ＋
            </button>

        </header>


        <section
            id="chatContainer"
            class="chat-container"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    AI
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask questions, write code, learn something new,
                    or have a conversation.
                </p>


                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-message="Explain Python in simple words"
                    >

                        <span>
                            ⌘
                        </span>

                        Explain Python simply

                    </button>


                    <button
                        class="suggestion"
                        data-message="Help me learn programming"
                    >

                        <span>
                            ◇
                        </span>

                        Help me learn programming

                    </button>


                    <button
                        class="suggestion"
                        data-message="Write a professional resume summary"
                    >

                        <span>
                            ✦
                        </span>

                        Write something for me

                    </button>


                    <button
                        class="suggestion"
                        data-message="Tell me something interesting"
                    >

                        <span>
                            ◈
                        </span>

                        Something interesting

                    </button>

                </div>

            </div>

        </section>


        <div class="composer-area">

            <form
                id="chatForm"
                class="composer"
            >

                <textarea
                    id="messageInput"
                    placeholder="Message AI Chatbot..."
                    rows="1"
                    autocomplete="off"
                ></textarea>


                <button
                    type="submit"
                    id="sendButton"
                    aria-label="Send message"
                >

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M5 12H19M19 12L13 6M19 12L13 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>


            <div class="composer-footer">

                AI Chatbot may make mistakes.
                Verify important information.

            </div>

        </div>

    </main>

</div>


<script src="/static/js/chatbot.js"></script>

</body>

</html>
